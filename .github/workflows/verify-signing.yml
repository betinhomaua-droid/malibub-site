name: Verificação assinatura digital
on:
  pull_request:
    paths:
      - 'app.py'
      - 'icp_signing.py'
      - 'requirements.txt'
      - '.github/workflows/verify-signing.yml'
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar módulos Python
        run: python -m py_compile app.py icp_signing.py
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Verificar importação das APIs de assinatura
        run: |
          python - <<'PY'
          from pyhanko.pdf_utils.incremental_writer import IncrementalPdfFileWriter
          from pyhanko.sign import signers
          from pyhanko.sign.fields import SigSeedSubFilter
          from pyhanko.keys import load_certs_from_pemder
          from pyhanko_certvalidator import ValidationContext
          assert SigSeedSubFilter.PADES
          assert signers.SimpleSigner.load_pkcs12
          assert signers.PdfSignatureMetadata
          print("APIs importadas")
          PY
      - name: Verificar falha segura sem certificado
        run: |
          python - <<'PY'
          import os
          os.environ.pop("MALIBUB_A1_PFX_PATH", None)
          os.environ.pop("MALIBUB_A1_PFX_PASSWORD", None)
          from icp_signing import sign_pdf_bytes, SigningConfigurationError
          try:
              sign_pdf_bytes(b"%PDF-1.7\n")
          except SigningConfigurationError:
              print("Bloqueio sem certificado: OK")
          else:
              raise AssertionError("PDF sem certificado não foi bloqueado")
          PY
      - name: Assinar e validar PDF de teste com certificado efêmero
        run: |
          python - <<'PY'
          import io
          import os
          import tempfile
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives.serialization import pkcs12
          from cryptography.x509.oid import NameOID
          from reportlab.pdfgen import canvas
          from pyhanko.pdf_utils.reader import PdfFileReader
          from pyhanko.sign.validation import validate_pdf_signature
          from pyhanko_certvalidator import ValidationContext
          from icp_signing import sign_pdf_bytes
          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          subject = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, "CERTIFICADO DE TESTE NAO ICP BRASIL")])
          cert = (x509.CertificateBuilder().subject_name(subject).issuer_name(subject).public_key(key.public_key()).serial_number(x509.random_serial_number()).not_valid_before(datetime.now(timezone.utc)-timedelta(days=1)).not_valid_after(datetime.now(timezone.utc)+timedelta(days=1)).add_extension(x509.BasicConstraints(ca=True,path_length=None),critical=True).add_extension(x509.KeyUsage(digital_signature=True,content_commitment=True,key_encipherment=False,data_encipherment=False,key_agreement=False,key_cert_sign=True,crl_sign=True,encipher_only=False,decipher_only=False),critical=True).sign(key,hashes.SHA256()))
          with tempfile.TemporaryDirectory() as d:
              pfx=Path(d)/"test.pfx"
              roots=Path(d)/"roots.pem"
              pfx.write_bytes(pkcs12.serialize_key_and_certificates(b"test",key,cert,None,serialization.BestAvailableEncryption(b"test-pass")))
              roots.write_bytes(cert.public_bytes(serialization.Encoding.PEM))
              os.environ.update(MALIBUB_A1_PFX_PATH=str(pfx),MALIBUB_A1_PFX_PASSWORD="test-pass",MALIBUB_ICP_TRUST_ROOTS_PATH=str(roots))
              buf=io.BytesIO()
              c=canvas.Canvas(buf)
              c.drawString(72,720,"TESTE AUTOMATICO - NAO E DOCUMENTO CLINICO")
              c.save()
              signed=sign_pdf_bytes(buf.getvalue())
              assert len(PdfFileReader(io.BytesIO(signed)).embedded_signatures)==1
              print("Assinatura PAdES de teste validada; sem valor ICP-Brasil")
          PY
