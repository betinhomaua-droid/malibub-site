name: Validate A1 signing integration
on:
  pull_request:
    paths:
      - 'a1_signing.py'
      - 'tests/test_a1_signing.py'
      - 'requirements.txt'
      - '.github/workflows/validate-a1-signing.yml'
  workflow_dispatch:
jobs:
  signing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signing and PDF dependencies
        run: python -m pip install 'pyHanko>=0.25,<0.34' 'cryptography>=42,<47' 'reportlab>=4.2,<5'
      - name: Execute real A1 test-signature round trip
        run: python -m unittest discover -s tests -p 'test_a1_signing.py' -v
